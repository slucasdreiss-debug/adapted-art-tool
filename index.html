<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ec">
<title>Adapted Art Language</title>
<meta name="app-version" content="2.0-expanded-vocabulary">
<style>
:root{--bg:#f7f4ec;--surface:#fff;--ink:#202124;--muted:#666;--line:#dedbd2;--accent:#6d4c8d;--accent2:#efe8f5;--shadow:0 2px 10px rgba(0,0,0,.07)}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}
body.dark{--bg:#000;--surface:#111;--ink:#fff;--muted:#ddd;--line:#fff;--accent:#ffeb00;--accent2:#191919;--shadow:none}
body.simple .card img{display:none} body.simple .card{min-height:110px}
.app{max-width:900px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);padding:10px 0 8px}
.titlebar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.title{font-size:19px;font-weight:800;flex:1}.iconbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;min-width:46px;height:46px;font-size:22px;font-weight:800;box-shadow:var(--shadow)}
.sentence{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:10px 10px 10px 14px;box-shadow:var(--shadow)}
#sentence{font-size:20px;line-height:1.15;font-weight:800;flex:1;min-width:0}.speak{border:0;background:var(--accent);color:#fff;border-radius:13px;width:48px;height:48px;font-size:23px} body.dark .speak{color:#000}
.crumb{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;margin:12px 3px 7px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding-bottom:18px}
.card{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;min-height:155px;padding:12px 8px 11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow);font:inherit}
.card:active{transform:scale(.98);border-color:var(--accent)}.card img{width:86px;height:82px;object-fit:contain;border-radius:10px;background:#fff}
.card .word{font-size:19px;font-weight:800;line-height:1.05;text-align:center}.card .sub{font-size:12px;color:var(--muted);font-weight:700;text-align:center}
.colorchip{width:82px;height:82px;border:2px solid #333;border-radius:14px}
.settings{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none;align-items:flex-end}.settings.open{display:flex}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:900px;margin:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.sheet h2{margin:0 0 14px}.settingbtn{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;font-size:17px;font-weight:750}

/* v4 communication/accessibility enhancements */
.card.speaking{transform:scale(.97);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
#sentence{cursor:pointer}.wordhl{display:inline;border-radius:5px;padding:0 2px;margin:0 -1px}.wordhl.active{background:var(--accent);color:#fff}body.dark .wordhl.active{color:#000}
.settinggroup{margin:14px 0}.settinglabel{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:0 2px 6px}.settingrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.settingrow.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.choicebtn{background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:13px;padding:12px 8px;font-size:15px;font-weight:800}.choicebtn.selected{border-color:var(--accent);background:var(--accent2);box-shadow:inset 0 0 0 1px var(--accent)}
.settingnote{font-size:13px;line-height:1.35;color:var(--muted);margin:8px 2px 0}.divider{height:1px;background:var(--line);margin:16px 0}.lockbtn{display:flex;align-items:center;justify-content:space-between;gap:12px}.lockstate{font-size:13px;color:var(--muted)}
body.symbols .card .word{display:none} body.symbols .card{min-height:145px} body.symbols .card img{width:105px;height:100px}
body.words .card img,body.words .card .colorchip{display:none} body.words .card{min-height:110px}
body.settingslocked #gear{display:none}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);background:#202124;color:white;padding:10px 14px;border-radius:999px;font-weight:800;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:430px){.settingrow.three{grid-template-columns:1fr}.sheet{max-height:88vh;overflow:auto}}

@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.card{min-height:175px}.card img{width:100px;height:95px}}
</style>
</head>
<body>
<div class="app">
 <div class="top">
  <div class="titlebar">
   <button class="iconbtn" id="back" aria-label="Back">‹</button>
   <div class="title">Adapted Art Language</div>
   <button class="iconbtn" id="home" aria-label="Start over">↻</button>
   <button class="iconbtn" id="gear" aria-label="Settings">⚙</button>
  </div>
  <div class="sentence"><div id="sentence">Select an art process.</div><button class="speak" id="speak" aria-label="Speak">▶</button></div>
 </div>
 <div class="crumb" id="crumb">ART PROCESS</div>
 <main class="grid" id="grid"></main>
</div>
<div class="settings" id="settings"><div class="sheet">
 <h2 id="settingsTitle">Settings</h2>
 <div class="settinggroup"><div class="settinglabel" id="languageLabel">Language</div><div class="settingrow">
  <button class="choicebtn" data-setting="language" data-value="en">English</button><button class="choicebtn" data-setting="language" data-value="es">Español</button>
 </div></div>
 <div class="settinggroup"><div class="settinglabel" id="voiceLabel">Voice</div><div class="settingrow">
  <button class="choicebtn" data-setting="voice" data-value="girl">👧 Girl</button><button class="choicebtn" data-setting="voice" data-value="boy">👦 Boy</button>
 </div></div>
 <div class="settinggroup"><div class="settinglabel" id="rateLabel">Speech rate</div><div class="settingrow">
  <button class="choicebtn" data-setting="rate" data-value="slow">Slow</button><button class="choicebtn" data-setting="rate" data-value="standard">Standard</button>
 </div></div>
 <div class="settinggroup"><div class="settinglabel" id="accessLabel">Card display</div><div class="settingrow three">
  <button class="choicebtn" data-setting="access" data-value="both">Words + Symbols</button><button class="choicebtn" data-setting="access" data-value="symbols">Symbols Only</button><button class="choicebtn" data-setting="access" data-value="words">Words Only</button>
 </div></div>
 <div class="settinggroup"><div class="settinglabel" id="displayLabel">Display</div><div class="settingrow three">
  <button class="choicebtn" data-setting="display" data-value="default">Warm white</button><button class="choicebtn" data-setting="display" data-value="dark">High contrast</button><button class="choicebtn" data-setting="display" data-value="simple">Text only</button>
 </div></div>
 <div class="divider"></div>
 <button class="settingbtn lockbtn" id="lockSettings"><span id="lockText">Hide settings button</span><span class="lockstate" id="lockState">Off</span></button>
 <div class="settingnote" id="lockNote">When hidden, press and hold the app title for 2 seconds to reopen settings.</div>
 <button class="settingbtn" id="closeSettings">Close</button>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function render(key,push=true){

  const b=document.createElement("button");b.className="card";b.setAttribute("aria-label",tr(ch.label,"label"));
  if(ch.color){const sw=document.createElement("div");sw.className="colorchip";sw.style.background=ch.color;b.appendChild(sw)}

function select(ch){

 if(ch.action)firstAction=ch.action;

  if(parts.length){if(finalChosen)parts[parts.length-1]=ch.final;else{parts.push(ch.final);finalChosen=true}setSentence(parts.join(" "))}
  else setSentence(ch.final);

 const re=/\S+/g;let m,last=0;
 while((m=re.exec(text))){if(m.index>last)el.appendChild(document.createTextNode(text.slice(last,m.index)));const sp=document.createElement("span");sp.className="wordhl";sp.textContent=m[0];sp.dataset.start=m.index;sp.dataset.end=m.index+m[0].length;el.appendChild(sp);last=m.index+m[0].length}if(last<text.length)el.appendChild(document.createTextNode(text.slice(last)));

function voices(){return "speechSynthesis" in window?speechSynthesis.getVoices():[]}
function pickVoice(lang,gender){
 const all=voices();const prefix=lang==="es"?"es":"en";const pool=all.filter(v=>(v.lang||"").toLowerCase().startsWith(prefix));if(!pool.length)return null;
 const names=(lang==="es"?(gender==="girl"?["monica","paulina","luciana","marisol","sofia","elena","female","mujer"]:["jorge","diego","carlos","enrique","pablo","male","hombre"]):(gender==="girl"?["samantha","ava","allison","susan","victoria","zoe","female","woman"]:["aaron","alex","daniel","fred","tom","male","man"]));

}
function clearHighlight(){document.querySelectorAll("#sentence .wordhl.active").forEach(x=>x.classList.remove("active"))}
